apiVersion: v1
kind: Namespace
metadata:
  name: bolsa-hml
  labels:
    app.kubernetes.io/part-of: bolsa-atleta
    environment: hml
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: rq-hml
  namespace: bolsa-hml
spec:
  hard:
    requests.cpu: "8"
    requests.memory: 16Gi
    limits.cpu: "16"
    limits.memory: 32Gi
    pods: "40"
---
# Default deny ingress from other namespaces (exemplo; calibrar com CNI do cluster)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress-cross-ns
  namespace: bolsa-hml
spec:
  podSelector: {}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector: {}
