# Bolsa Atleta — DEV stack (esqueleto). Sem segredos reais.
# Uso: docker compose -f docker-compose.dev.yml --env-file .env up -d
name: bolsa-atleta-dev

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bolsa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-bolsa_dev}
    ports:
      - "5432:5432"
    volumes:
      - bolsa_pg_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [bolsa_dev]

  api:
    image: ${API_IMAGE:-bolsa-atleta-api:dev}
    build:
      context: ../../ # ajustar para monorepo real
      dockerfile: Dockerfile.api
    restart: unless-stopped
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://${POSTGRES_USER:-bolsa}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-bolsa_dev}
      APP_ENV: dev
      LOG_LEVEL: debug
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3001:3001"
    user: "1000:1000"
    read_only: true
    tmpfs: ["/tmp"]
    networks: [bolsa_dev]

  web:
    image: ${WEB_IMAGE:-bolsa-atleta-web:dev}
    build:
      context: ../../
      dockerfile: Dockerfile.web
    restart: unless-stopped
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost:3001
      APP_ENV: dev
    depends_on: [api]
    ports:
      - "3000:3000"
    user: "1000:1000"
    networks: [bolsa_dev]

networks:
  bolsa_dev:
    name: bolsa_dev_net

volumes:
  bolsa_pg_dev:
    name: bolsa_pg_dev_data
